# Look of the app: a dense, sober research terminal (models: TradingView strategy tester,
# Portfolio Visualizer, pyfolio tear sheets), not the default Streamlit template.

[theme]
base = "light"
primaryColor = "#1f4aa8"             # cobalt: buttons, sliders, the strategy line
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eceff3" # inputs and sidebar
textColor = "#14181f"
borderColor = "#dfe3e8"
showWidgetBorder = true
baseRadius = "0.25rem"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["1.6rem", "1.15rem", "0.95rem"]
headingFontWeights = [600, 600, 600]
baseFontSize = 14

[theme.sidebar]
backgroundColor = "#eef0f4"
secondaryBackgroundColor = "#ffffff"

[client]
toolbarMode = "viewer"  # hides the developer "Deploy" button for visitors
# Visitors see a short message instead of Python tracebacks (full details stay in the server log).
showErrorDetails = "none"
