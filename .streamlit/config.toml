# Look of the app: a dark trading terminal (models: TradingView, Interactive Brokers TWS,
# exchange web apps), not the default Streamlit template.

[theme]
base = "dark"
primaryColor = "#2f6bff"             # accent: buttons, selected items, the strategy line
backgroundColor = "#0c0f14"
secondaryBackgroundColor = "#151a21" # inputs and panels
textColor = "#d6dae1"
borderColor = "#232a33"
showWidgetBorder = true
baseRadius = "0.25rem"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["1.5rem", "1.1rem", "0.95rem"]
headingFontWeights = [600, 600, 600]
baseFontSize = 14

[theme.sidebar]
backgroundColor = "#10141a"
secondaryBackgroundColor = "#151a21"

[client]
toolbarMode = "viewer"  # hides the developer "Deploy" button for visitors
# Visitors see a short message instead of Python tracebacks (full details stay in the server log).
showErrorDetails = "none"
