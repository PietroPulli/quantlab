# Run the whole test suite on every push and pull request (all tests run offline).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quantlab and test tools
        run: pip install -e . pytest "streamlit>=1.38"
      - name: Run tests
        run: pytest -q
