# Evening run of the paper (virtual money) account: after the US close, every day
# (crypto trades at weekends too). Commits the updated paper/ files back to the repository.
name: paper-account

on:
  schedule:
    - cron: "30 22 * * *"  # 22:30 UTC
  workflow_dispatch:  # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency: paper-account  # never two runs at the same time

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/paper_trade.py
      - name: Save the account
        run: |
          git config user.name "quantlab-paper-bot"
          git config user.email "quantlab-paper-bot@users.noreply.github.com"
          git add paper/
          git diff --cached --quiet || git commit -m "Paper account: $(date -u +%F)"
          git push
